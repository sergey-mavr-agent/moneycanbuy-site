    <!-- theme before the first paint (src/lib/theme.ts): Auto = the device, a saved Light/Dark wins; no flash -->
    <script>
      (function () {
        var p = null;
        try { p = localStorage.getItem("mcb.theme"); } catch (e) {}
        var t = p === "light" || p === "dark" ? p : window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        var r = document.documentElement;
        r.dataset.theme = t;
        r.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#f6f7f4" : "#000000");
      })();
    </script>
