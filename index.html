    <script>
      (function () {
        var p = null;

        if (p !== "light" && p !== "dark" && p !== "auto") p = "dark";

        // inside Telegram (src/lib/tma.ts): its colour scheme wins from the first frame, read from the launch parameters
        // (#tgWebAppThemeParams=…, or the copy Telegram's SDK keeps for a reload) with the SDK's own dark test
        var tg = null;
        try {
          var lp = new URLSearchParams(location.hash.slice(1)).get("tgWebAppThemeParams") || new URLSearchParams(location.search.slice(1)).get("tgWebAppThemeParams");
          if (!lp) { var sv = JSON.parse(sessionStorage.getItem("__telegram__initParams") || "null"); lp = sv && sv.tgWebAppThemeParams; }
          if (lp) tg = JSON.parse(lp);
        } catch (e) {}
        var bg = tg && /^#[0-9a-f]{6}$/i.test(tg.bg_color || "") ? parseInt(tg.bg_color.slice(1), 16) : -1;
        if (bg >= 0) {
          var R = bg >> 16, G = (bg >> 8) & 255, B = bg & 255;
          t = Math.sqrt(0.299 * R * R + 0.587 * G * G + 0.114 * B * B) < 120 ? "dark" : "light";
          r.classList.add("tma");
        }
        r.dataset.theme = t;
        r.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#f6f7f4" : "#000000");
        // the skin (src/lib/skin.ts): Degen / YOLO / macOS, nothing saved = Degen
        var s = null;
        try { s = localStorage.getItem("mcb.skin"); } catch (e) {}
        r.dataset.skin = s === "yolo" || s === "minimal" ? "yolo" : s === "mac" ? s : "degen";
      })();
