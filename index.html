    <!-- theme before the first paint (src/lib/theme.ts): a saved Dark/Light/Auto wins, nothing saved = Dark; Auto = the device; no flash -->
    <script>
      (function () {
        var p = null;
        try { p = localStorage.getItem("mcb.theme"); } catch (e) {}
        if (p !== "light" && p !== "dark" && p !== "auto") p = "dark";
        var t = p !== "auto" ? p : window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        var r = document.documentElement;
        r.dataset.theme = t;
        r.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#f6f7f4" : "#000000");
      })();
    </script>
